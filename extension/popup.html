<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 380px; font-family: Arial, sans-serif; padding: 12px; margin: 0; }
  h2 { margin: 0 0 6px; font-size: 18px; }
  #status { font-size: 13px; color: #555; margin-bottom: 8px; }
  .box { background: #f2f2f2; border-radius: 8px; padding: 8px; font-size: 13px; margin-bottom: 10px; }
  label { font-size: 13px; font-weight: bold; display: block; margin-top: 8px; }
  textarea, select, input { width: 100%; box-sizing: border-box; margin-top: 4px; font-size: 13px; padding: 6px; }
  button { margin-top: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer; border: none; border-radius: 6px; }
  #start { background: #25D366; color: #fff; }
  #stop { background: #ddd; margin-left: 6px; }
  #progress { margin-top: 10px; font-size: 13px; font-weight: bold; }
  #log { margin-top: 6px; font-size: 12px; white-space: pre-wrap; max-height: 140px; overflow-y: auto; background: #fafafa; padding: 6px; border: 1px solid #eee; }
  .warn { font-size: 12px; color: #a33; margin-top: 10px; }
</style>
</head>
<body>
  <h2 id="brand">Bulk Sender</h2>
  <div id="status">...</div>
  <div class="box" id="clientBox"></div>

  <label>Numbers (ek line me ek number)</label>
  <textarea id="numbers" rows="6" placeholder="9829000000&#10;9829000001"></textarea>

  <label>Template</label>
  <select id="template"></select>

  <label>Custom message (template ki jagah, khaali chhodo agar template use karna hai)</label>
  <textarea id="customText" rows="3"></textarea>

  <label>Delay (seconds, 2 numbers ke beech — 5 se kam mat rakho)</label>
  <input id="delay" type="number" value="8" min="5">

  <button id="start">Start Bulk Send</button>
  <button id="stop">Stop</button>

  <div id="progress"></div>
  <div id="log"></div>

  <p class="warn">⚠️ Pehle web.whatsapp.com par login kar lo. Bulk/automated messages se WhatsApp number ban ho sakta hai — roz 50–100 se zyada mat bhejo, aur sirf permission wale numbers ko bhejo.</p>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
